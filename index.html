<style id="css-base">
:root{
  --bg:#0E1218; --panel:#151B24; --panel2:#1B2330; --line:#2A3543; --line-soft:#212B38;
  --txt:#EAEFF5; --mut:#8DA0B4; --dim:#5C6B7C;
  --ok:#3ECF8E; --ok-bg:rgba(62,207,142,.14);
  --err:#F4605B; --err-bg:rgba(244,96,91,.14);
  --abl:#FFC53D; --abl-bg:rgba(255,197,61,.16);
  --r-lg:18px; --r-md:12px; --r-sm:8px;
  --disp:'Archivo',system-ui,sans-serif;
  --body:'Instrument Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sh:0 12px 32px rgba(0,0,0,.42);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--body);background:var(--bg);color:var(--txt);
  min-height:100dvh;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(rgba(141,160,180,.055) 1.1px,transparent 1.1px);
  background-size:26px 26px;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--txt);background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-md);padding:11px 13px;width:100%;outline:none}
input:focus-visible,select:focus-visible,textarea:focus-visible{border-color:var(--abl);box-shadow:0 0 0 3px rgba(255,197,61,.18)}
input::placeholder{color:var(--dim)}
a{color:inherit}
::selection{background:rgba(255,197,61,.32)}
[hidden]{display:none!important}
.mono{font-family:var(--mono)}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--abl);outline-offset:2px}

/* ---------- splash ---------- */
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;
  transition:opacity .45s ease,visibility .45s}
#splash.gone{opacity:0;visibility:hidden}
.sp-in{text-align:center}
.sp-sheet{display:flex;gap:10px;justify-content:center;margin-bottom:22px}
.sp-row{display:grid;grid-template-columns:22px 22px;gap:8px}
.sp-n{display:grid;place-items:center;font-family:var(--mono);font-size:12px;color:var(--dim);height:22px}
.sp-b{width:22px;height:22px;border-radius:50%;border:1.6px solid var(--line);background:var(--panel2);
  animation:spFill .5s cubic-bezier(.5,1.6,.4,1) both}
@keyframes spFill{0%{transform:scale(.6);border-color:var(--line)}
  55%{transform:scale(1.28)}100%{transform:scale(1)}}
.sp-b.f-ok{border-color:var(--ok);background:var(--ok);box-shadow:0 0 14px rgba(62,207,142,.5)}
.sp-b.f-er{border-color:var(--err);background:var(--err);box-shadow:0 0 14px rgba(244,96,91,.5)}
.sp-b.f-ab{border-color:var(--abl);background:var(--abl);box-shadow:0 0 14px rgba(255,197,61,.5)}
.sp-b.f-no{border-color:var(--abl);background:transparent;box-shadow:0 0 0 2px var(--abl-bg)}
.sp-word{font-family:var(--disp);font-weight:800;font-stretch:110%;font-size:clamp(34px,8vw,56px);
  letter-spacing:-.01em;line-height:1;
  clip-path:inset(0 100% 0 0);animation:spReveal .8s .55s cubic-bezier(.7,0,.3,1) forwards}
.sp-word em{font-style:normal;color:var(--abl)}
@keyframes spReveal{to{clip-path:inset(0 0 0 0)}}
.sp-tag{margin-top:12px;color:var(--mut);font-size:14px;letter-spacing:.22em;text-transform:uppercase;
  opacity:0;animation:spFade .6s 1.05s forwards}
.sp-tag b{color:var(--ok);font-weight:600}.sp-tag i{color:var(--err);font-style:normal}.sp-tag u{color:var(--abl);text-decoration:none}
@keyframes spFade{to{opacity:1}}
.sp-bar{width:180px;height:3px;border-radius:99px;background:var(--line-soft);margin:26px auto 0;overflow:hidden}
.sp-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ok),var(--abl),var(--err));animation:spBar 1.9s linear forwards}
@keyframes spBar{to{width:100%}}
@media (prefers-reduced-motion:reduce){.sp-word,.sp-tag{animation:none;clip-path:none;opacity:1}.sp-b{animation:none}.sp-bar i{animation:none;width:100%}}

/* ---------- lock ---------- */
#lock{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:24px;
  background:var(--bg);transition:opacity .4s ease,visibility .4s}
#lock.gone{opacity:0;visibility:hidden}
.lk-card{width:min(380px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:34px 30px 30px;box-shadow:var(--sh);position:relative;animation:lkUp .55s .15s cubic-bezier(.2,.9,.3,1) both}
@keyframes lkUp{from{transform:translateY(14px);opacity:0}}
.lk-card.shake{animation:lkShake .4s}
@keyframes lkShake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.lk-bubbles{display:flex;gap:7px;margin-bottom:18px}
.lk-bubbles i{width:11px;height:11px;border-radius:50%;background:var(--line)}
.lk-bubbles i:nth-child(1){background:var(--ok)}.lk-bubbles i:nth-child(2){background:#233041}
.lk-bubbles i:nth-child(3){background:var(--err)}.lk-bubbles i:nth-child(4){background:#233041}
.lk-bubbles i:nth-child(5){background:var(--abl)}
.lk-card h1{font-family:var(--disp);font-stretch:110%;font-weight:800;font-size:26px;letter-spacing:-.01em}
.lk-card h1 em{font-style:normal;color:var(--abl)}
.lk-sub{color:var(--mut);font-size:13.5px;margin:6px 0 22px}
.lk-row{position:relative}
.lk-row input{padding-right:46px;font-family:var(--mono);letter-spacing:.24em}
.lk-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);padding:8px;color:var(--mut);border-radius:8px}
.lk-eye:hover{color:var(--txt)}
.lk-msg{min-height:20px;font-size:12.5px;color:var(--err);margin:8px 2px 14px}
.lk-hint{font-size:11.5px;color:var(--mut);margin:-8px 2px 14px;line-height:1.7}
.lk-hint b{color:var(--abl)}
.lk-fill{color:var(--abl);font-weight:700;text-decoration:underline;padding:0}
.lk-btn{width:100%;background:var(--abl);color:#231A02;font-weight:700;border-radius:var(--r-md);
  padding:13px;font-size:15px;transition:transform .12s,filter .12s;touch-action:manipulation}
.lk-btn:hover{filter:brightness(1.06)}.lk-btn:active{transform:scale(.98)}
.lk-foot{margin-top:16px;text-align:center;color:var(--dim);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase}

/* ---------- app shell ---------- */
#app{min-height:100dvh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:40;background:rgba(14,18,24,.86);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line-soft)}
.top-in{max-width:1060px;margin:0 auto;padding:13px 18px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-stretch:110%;font-weight:800;font-size:19px;letter-spacing:-.01em}
.brand em{font-style:normal;color:var(--abl)}
.brand-dots{display:flex;gap:3.5px}
.brand-dots i{width:7px;height:7px;border-radius:50%}
.brand-dots i:nth-child(1){background:var(--ok)}.brand-dots i:nth-child(2){background:var(--err)}.brand-dots i:nth-child(3){background:var(--abl)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.lock-mini{padding:7px 12px;border:1px solid var(--line);border-radius:99px;color:var(--mut);font-size:12.5px}
.lock-mini:hover{color:var(--txt);border-color:var(--dim)}
main{flex:1;width:100%;max-width:1060px;margin:0 auto;padding:22px 18px 108px}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(17,22,30,.94);backdrop-filter:blur(12px);
  border-top:1px solid var(--line-soft);display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tab{flex:1;max-width:130px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 6px;
  border-radius:12px;color:var(--dim);font-size:10.5px;font-weight:600;letter-spacing:.02em;transition:color .15s}
.tab svg{width:21px;height:21px}
.tab.on{color:var(--abl)}
.tab.on::after{content:"";width:4px;height:4px;border-radius:50%;background:var(--abl);position:absolute;transform:translateY(26px)}
@media (min-width:820px){
  .tabbar{top:64px;bottom:auto;right:auto;left:auto;position:fixed;border:0;background:none;
    max-width:1060px;width:100%;padding:16px 18px 0}
  .tabbar-wrap{max-width:1060px;margin:0 auto;padding:0 18px}
}
/* desktop rail */
@media (min-width:820px){
  main{padding:26px 18px 80px;margin-top:58px}
  .tabbar{position:static;display:flex;gap:4px;border-bottom:1px solid var(--line-soft);background:none;padding:0 18px;backdrop-filter:none}
  .top+.tabbar{max-width:1060px;margin:0 auto}
  .tab{flex:0 auto;flex-direction:row;gap:8px;font-size:13.5px;padding:13px 16px 15px;border-radius:0;position:relative}
  .tab.on::after{content:"";width:100%;height:2px;border-radius:0;background:var(--abl);position:absolute;left:0;bottom:-1px;transform:none}
  .tab svg{width:17px;height:17px}
}
.tabbar-float{position:fixed;bottom:0;left:0;right:0;z-index:40}
@media (min-width:820px){.tabbar-float{position:static}}

/* ---------- shared UI ---------- */
.view{display:none;animation:vIn .3s ease}
.view.on{display:block}
@keyframes vIn{from{opacity:0;transform:translateY(8px)}}
.pt{font-family:var(--disp);font-stretch:110%;font-weight:800;font-size:clamp(23px,4.4vw,31px);letter-spacing:-.015em;line-height:1.12}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.kicker{display:flex;align-items:center;gap:8px;color:var(--dim);font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:8px}
.kicker::before{content:"";width:18px;height:1px;background:var(--dim)}
.lead{color:var(--mut);font-size:14px;margin-top:6px;max-width:52ch}
.card{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r-lg);padding:18px;position:relative}
.card+.card{margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 17px;border-radius:var(--r-md);
  font-weight:600;font-size:14px;border:1px solid var(--line);color:var(--txt);background:var(--panel2);
  transition:transform .1s,border-color .15s,background .15s;white-space:nowrap}
.btn:hover{border-color:var(--dim);background:#202939}
.btn:active{transform:scale(.98)}
.btn svg{width:17px;height:17px;flex:none}
.btn-pri{background:var(--abl);color:#231A02;border-color:var(--abl)}
.btn-pri:hover{background:#ffd35e;border-color:#ffd35e}
.btn-cap{background:var(--ok);color:#03251a;border-color:var(--ok)}
.btn-cap:hover{background:#5ce0a4;border-color:#5ce0a4}
.btn-err{color:var(--err);border-color:rgba(244,96,91,.4)}
.btn-err:hover{background:var(--err-bg);border-color:var(--err)}
.btn-sm{padding:8px 12px;font-size:12.5px;border-radius:10px}
.btn-ghost{background:transparent;border-color:transparent;color:var(--mut)}
.btn-ghost:hover{color:var(--txt);background:var(--panel2);border-color:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;color:var(--mut);border:1px solid transparent}
.icon-btn:hover{color:var(--err);border-color:rgba(244,96,91,.35)}
.icon-btn svg{width:16px;height:16px}
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin-bottom:6px;letter-spacing:.02em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.row{display:flex;gap:10px;align-items:center}
.spacer{flex:1}
.empty{text-align:center;padding:42px 20px;border:1.5px dashed var(--line);border-radius:var(--r-lg);color:var(--mut)}
.empty .e-bub{display:flex;gap:9px;justify-content:center;margin-bottom:14px}
.empty .e-bub i{width:15px;height:15px;border-radius:50%;border:1.6px solid var(--line);background:var(--panel2)}
.empty .e-bub i:nth-child(2){border-color:var(--abl);background:var(--abl-bg)}
.empty strong{color:var(--txt);display:block;margin-bottom:4px;font-size:15px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3.5px 10px;border-radius:99px;font-size:11.5px;font-weight:600;
  font-family:var(--mono);letter-spacing:.03em}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.err{background:var(--err-bg);color:var(--err)}
.pill.abl{background:var(--abl-bg);color:var(--abl)}
.pill.mut{background:var(--panel2);color:var(--mut);border:1px solid var(--line)}
.toast-wrap{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);z-index:95;display:flex;flex-direction:column-reverse;gap:8px;width:min(420px,92vw);pointer-events:none}
.toast{background:#202A38;border:1px solid var(--line);border-radius:var(--r-md);padding:12px 15px;font-size:13.5px;
  box-shadow:var(--sh);display:flex;gap:10px;align-items:center;animation:toIn .25s cubic-bezier(.2,.9,.3,1)}
.toast i{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ok)}
.toast.err i{background:var(--err)}.toast.abl i{background:var(--abl)}
@keyframes toIn{from{opacity:0;transform:translateY(10px)}}
.modal-bg{position:fixed;inset:0;z-index:70;background:rgba(6,9,13,.72);backdrop-filter:blur(4px);
  display:grid;place-items:center;padding:16px;animation:mIn .22s ease}
@keyframes mIn{from{opacity:0}}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);width:min(560px,96vw);
  max-height:92dvh;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--sh);animation:mdUp .28s cubic-bezier(.2,.9,.3,1)}
@keyframes mdUp{from{transform:translateY(16px);opacity:0}}
.modal-head{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line-soft);
  position:sticky;top:0;background:var(--panel);z-index:2;flex:none}
.modal-head h3{font-family:var(--disp);font-stretch:110%;font-weight:800;font-size:17px}
.modal-body{padding:18px;overflow:auto;min-height:0;flex:1}
.x-btn{margin-left:auto;width:32px;height:32px;display:grid;place-items:center;border-radius:9px;color:var(--mut)}
.x-btn:hover{color:var(--txt);background:var(--panel2)}
.dots-bg{background-image:radial-gradient(rgba(141,160,180,.12) 1.2px,transparent 1.2px);background-size:20px 20px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
<style id="css-app">
/* ===== HOME ===== */
.hero{border:1px solid var(--line-soft);border-radius:var(--r-lg);background:
  linear-gradient(180deg,rgba(255,197,61,.05),transparent 55%),var(--panel);
  padding:26px 24px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:210px;height:210px;border-radius:50%;
  background:radial-gradient(circle at center,rgba(255,197,61,.12),transparent 65%);pointer-events:none}
.hero h2{font-family:var(--disp);font-stretch:110%;font-weight:800;font-size:clamp(24px,5vw,34px);letter-spacing:-.02em;line-height:1.1;max-width:18ch}
.hero h2 mark{background:none;color:var(--abl)}
.hero p{color:var(--mut);margin:12px 0 20px;max-width:52ch;font-size:14.5px}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
@media (max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r-md);padding:15px 16px}
.stat b{font-family:var(--disp);font-stretch:110%;font-weight:800;font-size:27px;display:block;line-height:1.1}
.stat span{color:var(--mut);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.stat i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.how{margin-top:26px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
@media (max-width:700px){.steps{grid-template-columns:1fr}}
.step{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r-md);padding:16px}
.step .sn{font-family:var(--mono);font-size:11px;color:var(--abl);letter-spacing:.18em}
.step h4{margin:8px 0 5px;font-size:15px;font-weight:700}
.step p{color:var(--mut);font-size:13px;line-height:1.5}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:var(--mut)}
.legend b{display:inline-flex;align-items:center;gap:7px;font-weight:500;color:var(--txt)}
.legend i{width:12px;height:12px;border-radius:50%}

/* ===== TURMAS ===== */
.list{display:flex;flex-direction:column;gap:14px}
.turma{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r-lg);overflow:hidden}
.turma-head{display:flex;align-items:center;gap:12px;padding:15px 17px;cursor:pointer;user-select:none}
.turma-head:hover{background:#18202c}
.turma-av{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-family:var(--disp);font-weight:800;
  font-stretch:110%;font-size:15px;background:var(--panel2);border:1px solid var(--line);color:var(--abl);flex:none}
.turma-meta b{display:block;font-size:15px}
.turma-meta span{color:var(--mut);font-size:12.5px}
.turma-actions{margin-left:auto;display:flex;gap:4px;align-items:center}
.chev{transition:transform .2s;color:var(--dim)}
.turma.open .chev{transform:rotate(180deg)}
.turma-body{display:none;border-top:1px solid var(--line-soft);padding:14px 17px 17px;background:#121822}
.turma.open .turma-body{display:block}
.aluno{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px dashed var(--line-soft);font-size:14px}
.aluno:last-child{border-bottom:0}
.aluno .idx{font-family:var(--mono);font-size:11px;color:var(--dim);width:26px;flex:none}
.aluno .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.add-row{display:flex;gap:8px;margin-top:12px}
.add-row input{flex:1}
.turma-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:13px;border-top:1px dashed var(--line)}
.xls-note{font-size:12px;color:var(--dim);margin-top:8px;line-height:1.5}

/* ===== GABARITOS ===== */
.gab-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.gab-card{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r-lg);padding:17px;display:flex;flex-direction:column;gap:9px}
.gab-card .g-kick{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.gab-card h4{font-size:16px;line-height:1.25}

function normalizeDB(d){ d=d||{};
  DB.turmas=Object.values(d.turmas||{});DB.gabaritos=Object.values(d.gabaritos||{});DB.corr=Object.values(d.corr||{});
  let fixed=false;
  DB.gabaritos.forEach(g=>{ if(!g.id||g.id==='undefined'){g.id=uid();fixed=true;}
    g.itens=g.itens?Object.values(g.itens):[]; g.corretas=g.corretas?Object.values(g.corretas):[];

  DB.turmas.forEach(t=>{ if(!t.id){t.id=uid();fixed=true;}

  try{ if(!firebase.apps.length) firebase.initializeApp(cfg);
    FB_REF=firebase.database().ref(window.FIREBASE_PATH||'gabarita');
    FB_REF.on('value',snap=>{ const v=snap.val(); const str=JSON.stringify(v||{});
      const first=!FB_READY; FB_READY=true;
      if(first && FB_PENDING){ FB_PENDING=false; saveDB(); return; } /* alteração feita antes de conectar: ela vence */
      if(!first && str===lastSent) return;
      if(v===null){
        /* banco online vazio: só envia os dados locais na 1ª sincronização deste aparelho (migração);
           depois disso, vazio online = tudo foi excluído, então o aparelho acompanha */
        let synced=false; try{synced=localStorage.getItem(KEY+'_synced')==='1';}catch(e){}
        if(!synced && (DB.turmas.length||DB.gabaritos.length||DB.corr.length)){ saveDB(); return; }
        normalizeDB({}); try{localStorage.setItem(KEY,JSON.stringify(DB));localStorage.setItem(KEY+'_synced','1');}catch(e){}
        if(!$('#modal-root').innerHTML && !$('#app').hidden && RENDER[currentView]) RENDER[currentView]();
        return; }
      const fixed=normalizeDB(v); try{localStorage.setItem(KEY,JSON.stringify(DB));localStorage.setItem(KEY+'_synced','1');}catch(e){}
      if(fixed) saveDB();
      if(!$('#modal-root').innerHTML && !$('#app').hidden && RENDER[currentView]) RENDER[currentView]();
    },err=>{ console.error(err); toast('Sem acesso ao banco online: '+err.code,'err'); });
  }catch(e){ console.error(e); toast('Erro ao conectar ao Firebase','err'); } }
function loadDB(){ let d=null; try{ const raw=localStorage.getItem(KEY); if(raw) d=JSON.parse(raw); }catch(e){ console.warn('load',e);}
  const fixed=normalizeDB(d); if(fixed) saveDB(); if(!FB_REF) initFirebase(); }
function saveDB(){ let ok=true; const clean=JSON.parse(JSON.stringify(DB));
  try{ localStorage.setItem(KEY,JSON.stringify(DB)); }catch(e){ ok=false; }
  if(FB_REF){
    /* não sobrescreve o banco online com dados antigos do aparelho antes de receber a versão atual */
    if(!FB_READY){ FB_PENDING=true; return ok; }
    /* _meta garante que o banco online nunca fica "vazio" (null) após excluir tudo,
       evitando que aparelhos com cópia antiga reenviem os dados excluídos */
    clean._meta={ts:Date.now(),rev:Math.random().toString(36).slice(2)};
    lastSent=JSON.stringify(clean);
    FB_REF.set(clean).then(()=>{ try{localStorage.setItem(KEY+'_synced','1');}catch(e){} })
      .catch(e=>{ console.error(e); toast('Falha ao salvar online: '+(e.code||e.message),'err'); }); return true; }
  if(!ok) toast('Estoque cheio — remova capturas antigas em Resultados','err');
  return ok; }

function normSenha(s){ return String(s).normalize('NFKC')            /* ｆｕｌｌ→ascii */
  .replace(/[\u200B-\u200D\uFEFF]/g,'')                              /* zero-width */
  .replace(/[\u00A0\u2007\u202F\u3000]/g,' ')                        /* espaços exóticos */
  .trim().toLowerCase()
  .normalize('NFKD').replace(/[\u0300-\u036f]/g,'')                  /* acentos */
  .replace(/[\u2010-\u2015\u2212]/g,'-'); }                          /* travessões */

function buildSplashSheet(){ const wrap=$('#sp-sheet');

    row.forEach((cls,i)=>{ const b=document.createElement('div');
      b.className='sp-b'+(cls==='no'?'':' f-'+({ok:'ok',er:'er',cb:'no',ab:'ab'}[cls]));
      b.style.animationDelay=(delays[r]+i*.14+.25)+'s'; d.appendChild(b); });

/* ---- Excel import ---- */
function importExcel(e){
  const file=e.target.files[0]; if(!file) return;
  const t=getTurma(e.target.dataset.t); if(!t) return;
  const fr=new FileReader();
  fr.onload=ev=>{ try{
      const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''});
      const names=[];
      rows.forEach((r,ri)=>{ const cells=r.map(c=>String(c||'').replace(/\s+/g,' ').trim()).filter(Boolean);
        if(!cells.length) return;
        const cand=cells.find(c=>c.length>=3&&/[a-zA-Z\u00C0-\u024F]/.test(c)&&!/^[\d._-]+$/.test(c))||cells[0];
        if(ri===0&&/nome|aluno|estudante/i.test(cand)&&rows.length>2) return;
        if(!names.includes(cand)) names.push(cand); });
      showXlsModal(t,names,file.name);
    }catch(err){ toast('Não foi possível ler a planilha','err'); console.warn(err); } };
  fr.readAsArrayBuffer(file);
}

/* ---- robust PDF delivery (works in iframes/webviews) ---- */
let _jsPdfP=null;
function ensureJsPdf(){ if(window.jspdf) return Promise.resolve();
  if(_jsPdfP) return _jsPdfP;
  const srcs=['https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js','https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js'];
  _jsPdfP=new Promise((res,rej)=>{
    const trySrc=i=>{ if(i>=srcs.length){_jsPdfP=null; rej(new Error('sem conexão para a biblioteca de PDF')); return;}
      const sc=document.createElement('script'); sc.src=srcs[i]; sc.async=true;
      sc.onload=()=>window.jspdf?res():trySrc(i+1);
      sc.onerror=()=>trySrc(i+1);
      document.head.appendChild(sc); };
    trySrc(0); });
  return _jsPdfP; }
function inIframe(){ try{ return window.top!==window.self; }catch(e){ return true; } }
function deliverPdf(doc,fname){
  let blob,url;
  try{ blob=doc.output('blob'); url=URL.createObjectURL(blob); }
  catch(e){ toast('PDF indisponível — tente novamente','err'); return; }
  try{ const a=document.createElement('a'); a.href=url; a.download=fname; a.rel='noopener';
    document.body.appendChild(a); a.click(); a.remove(); toast('Folha de gabarito baixada em PDF'); }catch(e){}
  if(inIframe()){ try{ window.open(url,'_blank'); }catch(e){} }
  setTimeout(()=>{ try{ URL.revokeObjectURL(url); }catch(e){} },240000);
}

function gerarPdf(g){
  if(!g.itens||!g.itens.length){ toast('Adicione ao menos 1 quest\u00e3o','err'); return; }
  if(!window.jspdf){ toast('Carregando biblioteca de PDF\u2026','abl');
    ensureJsPdf().then(()=>gerarPdf(g)).catch(e=>toast('N\u00e3o consegui carregar o gerador de PDF ('+e.message+')','err')); return; }
  const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:'mm',format:'a4'});
  const Q=g.itens.length, maxIt=Math.max(...g.itens);
  const PITCH=PD.PITCH, COL=PD.COL;                    // 6mm entre linhas, 7mm por item
  const cellW=COL;
  const r=PD.BR;                                       // c\u00edrculo \u00d8 3,8 mm (padr\u00e3o cart\u00e3o-resposta)
  const pages=[]; for(let i=0;i<Q;i+=MAXROWS(g)) pages.push([i,Math.min(Q,i+MAXROWS(g))]);
  pages.forEach((pr,pi)=>{
    if(pi>0)doc.addPage();
    const rows=pr[1]-pr[0], L=gridLayout(rows,maxIt);
    /* c\u00e9lula — todo texto acima da faixa livre das marcas (YT\u22127) */
    doc.setTextColor(24,28,34); doc.setFont('helvetica','bold'); doc.setFontSize(11.5);
    doc.text(String(g.escola||'Escola').toUpperCase().slice(0,58),14,12.5);
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(30,36,44);
    doc.setFillColor(255,197,61); doc.rect(14,14.6,3,3,'F');
    doc.text('FOLHA DE RESPOSTAS \u2014 '+String(g.nome).slice(0,52),19,17.2);
    doc.setTextColor(125,134,145); doc.setFontSize(6.8);
    doc.text(`${Q} quest\u00f5es \u00b7 ${maxIt} itens`+(pages.length>1?` \u00b7 p\u00e1gina ${pi+1} de ${pages.length} (quest\u00f5es ${pr[0]+1}\u2013${pr[1]})`:' \u00b7 impress\u00e3o A4')
      +' \u00b7 preencha 1 \u00fanico c\u00edrculo por quest\u00e3o com caneta azul ou preta',19,21.2);
    doc.setDrawColor(80,88,98); doc.setLineWidth(.4); doc.line(14,23.5,196,23.5);
    doc.setTextColor(35,40,47); doc.setFontSize(8.5);
    doc.text('Nome: ________________________________________________________________________',14,29.5);
    doc.text('Turma: ______________',14,35.5); doc.text('Data: ____ / ____ / ______',66,35.5); doc.text('C\u00f3digo: __________',120,35.5);
    /* marcas de registro (bra\u00e7os de 4 mm) — na faixa 45\u201352, sem texto por perto */
    /* 4 marcas fiduciais: quadrados pretos s\u00f3lidos (leitura autom\u00e1tica pela c\u00e2mera) */
    doc.setFillColor(0,0,0);
    fidMM(rows,maxIt).forEach(([fx,fy])=>doc.rect(fx-PD.FS/2,fy-PD.FS/2,PD.FS,PD.FS,'F'));
    /* letras dos itens no topo da grelha */
    doc.setFont('helvetica','bold'); doc.setFontSize(6); doc.setTextColor(90,99,110);
    for(let c=0;c<L.nCols;c++) for(let i=0;i<maxIt;i++) doc.text(itemLabel(i),colX(c,L)+(i+.5)*cellW,PD.YT-1.2,{align:'center'});
    /* grelha: n\u00famero \u00e0 esquerda da coluna, bolinha com letra dentro */
    for(let q=pr[0];q<pr[1];q++){
      const rowIdx=q-pr[0], [x0,cy]=bubbleMM(rowIdx,0,maxIt,rows), cxL=x0-.5*cellW;
      doc.setFont('helvetica','bold'); doc.setFontSize(7); doc.setTextColor(40,46,54);
      doc.text(String(q+1).padStart(2,'0'),cxL-0.6,cy+0.9,{align:'right'});
      const n=g.itens[q];
      for(let i=0;i<n;i++){
        const cx=cxL+(i+.5)*cellW;
        doc.setDrawColor(70,78,88); doc.setLineWidth(.25); doc.circle(cx,cy,r,'S');
        doc.setFont('helvetica','normal'); doc.setFontSize(5); doc.setTextColor(185,191,198);
        doc.text(itemLabel(i),cx,cy+0.62,{align:'center'});
      }
    }
    doc.setFontSize(6.2); doc.setTextColor(150,158,168);
    doc.text('Corre\u00e7\u00e3o por c\u00e2mera: mantenha os 4 quadrados pretos vis\u00edveis, limpos e sem dobras. Preencha a bolha por completo.',14,292);
    if(pages.length>1){ doc.text(`p\u00e1gina ${pi+1}/${pages.length}`,196,292,{align:'right'}); }
  });
  const fname=`folha-gabarito_${(g.escola||'escola').replace(/[^\w]+/g,'-').toLowerCase()}_${(g.nome||'gabarito').replace(/[^\w]+/g,'-').toLowerCase()}.pdf`;
  deliverPdf(doc,fname);
}

/* Exporta apenas as leituras selecionadas, sem alterar os dados salvos. */
function gruposResultados(rows){
  const groups=new Map();
  rows.forEach(c=>{
    const key=JSON.stringify([c.turmaId,c.gabId]);
    if(!groups.has(key)){
      const t=getTurma(c.turmaId),g=getGab(c.gabId);
      groups.set(key,{escola:(g&&g.escola)||(t&&t.escola)||'Não informada',turma:(t&&t.nome)||'Turma removida',disciplina:(g&&g.disciplina)||'Não informada',avaliacao:(g&&g.nome)||'Gabarito removido',alunos:new Map(),g});
    }
    const group=groups.get(key),id=c.alunoId||c.alunoNm||c.id;
    if(!group.alunos.has(id))group.alunos.set(id,{nome:c.alunoNm||'Aluno sem nome',leituras:[]});
    group.alunos.get(id).leituras.push(c);
  });
  return [...groups.values()].map(group=>{
    const alunos=[...group.alunos.values()].map(a=>{
      const slots=new Map();
      a.leituras.sort((x,y)=>x.data-y.data).forEach(c=>(c.status||[]).forEach((s,q)=>slots.set((c.r0||0)+q,s)));
      const total=group.g?group.g.itens.length:Math.max(slots.size,...a.leituras.map(c=>(c.r0||0)+(c.total||0)));
      const acertos=[...slots.values()].filter(s=>s==='ok').length;
      return {nome:a.nome,acertos,total,parcial:slots.size<total};
    }).sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
    return {...group,alunos};
  });
}

function gerarResultadosPdf(rows){
  if(!rows.length){toast('Nenhum resultado para baixar','abl');return;}
  if(!window.jspdf){
    toast('Preparando PDF. Toque em baixar novamente quando estiver pronto.','abl');
    ensureJsPdf().then(()=>toast('PDF pronto — toque em baixar','abl')).catch(()=>toast('Não foi possível carregar o PDF. Confira sua conexão e tente novamente.','err'));
    return;
  }
  try{
    const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
    doc.setProperties({title:'Gabarita+ — Resultados',subject:'Relatório de correções salvas',creator:'Gabarita+'});
    let y=0;
    const groups=gruposResultados(rows);
    function line(value,size=10,bold=false){
      doc.setFont('helvetica',bold?'bold':'normal');doc.setFontSize(size);
      const lines=doc.splitTextToSize(String(value),182);
      doc.text(lines,14,y);y+=lines.length*5+2;
    }
    function header(group){
      y=18;line('GABARITA+ | Relação de notas',17,true);
      line(`Escola: ${group.escola}`);
      line(`Turma: ${group.turma}`);
      line(`Disciplina: ${group.disciplina}`,10,true);
      line(`Avaliação: ${group.avaliacao}`);
      line(`Emitido em ${fmtData(Date.now())} | ${group.alunos.length} aluno(s)`,9);
      y+=3;doc.setDrawColor(170);doc.line(14,y,196,y);y+=7;
      doc.setFont('helvetica','bold');doc.setFontSize(10);
      doc.text('Nº',14,y);doc.text('Nome do aluno',26,y);doc.text('Nota',196,y,{align:'right'});y+=7;
    }
    groups.forEach((group,gi)=>{
      if(gi)doc.addPage();header(group);
      group.alunos.forEach((a,index)=>{
        doc.setFont('helvetica','normal');doc.setFontSize(10);
        const names=doc.splitTextToSize(a.nome,119),height=Math.max(9,names.length*5+4);
        if(y+height>278){doc.addPage();header(group);doc.setFont('helvetica','normal');doc.setFontSize(10);}
        doc.text(String(index+1),14,y);doc.text(names,26,y);
        doc.text(`${a.acertos}/${a.total}${a.parcial?' (parcial)':''}`,196,y,{align:'right'});

<script id="js-scan">

      <div class="sc-steps" id="sc-steps"><i class="on"></i><i></i><i></i><i></i></div>

SCAN.stopStream=function(){ SCAN.live=null; if(SCAN.stream){SCAN.stream.getTracks().forEach(t=>t.stop());SCAN.stream=null;} };
const STEP_IDX={cam:0,crop:1,ana:2,res:3};
function scSteps(n){ $('#sc-steps').innerHTML=[0,1,2,3].map(i=>`<i class="${i<=n?'on':''}"></i>`).join(''); }

/* ---- step 1: camera (detecção ao vivo + captura automática) ---- */
function scCam(st,ft){
  st.innerHTML=''; ft.innerHTML=''; SCAN.camErr=false;
  const fileHTML=`<input type="file" id="sc-file" accept="image/*" capture="environment" hidden>`;
  function noCam(msg){
    SCAN.camErr=true; SCAN.live=null;
    st.innerHTML=`<div class="cam-err"><strong>${esc(msg)}</strong>

    ft.innerHTML=`<label class="btn btn-pri" for="sc-file" style="margin:0 auto">Enviar foto da folha</label>${fileHTML}`;

function scLiveLoop(video,ov){
  const token={}; SCAN.live=token; let hist=[], busy=false;

    if(!video.videoWidth||busy){ setTimeout(tick,150); return; }
    const W=640, s=W/video.videoWidth, H=Math.round(video.videoHeight*s);
    const c=document.createElement('canvas'); c.width=W; c.height=H; c.getContext('2d').drawImage(video,0,0,W,H);

  };

}
function grabFrame(v){ const c=document.createElement('canvas'); c.width=v.videoWidth; c.height=v.videoHeight;
  c.getContext('2d').drawImage(v,0,0); return c; }
/* captura 3 quadros e usa o mais nítido; localiza as marcas em resolução total */
async function scShoot(auto){
  if(SCAN.camErr){ $('#sc-file').click(); return; }
  const v=SCAN.video; if(!v||!v.videoWidth){ toast('Aguarde a câmera preparar o vídeo','abl'); return; }
  const frames=[]; for(let k=0;k<3;k++){ frames.push(grabFrame(v)); await new Promise(r=>setTimeout(r,90)); }

  if(f){ SCAN.quad=f; SCAN.quadPage=SCAN.page; if(navigator.vibrate)try{navigator.vibrate(60);}catch(e){}

function scPickFile(f){ if(!f)return; const img=new Image();
  img.onload=()=>{ const max=2600,s=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);

}
/* ---- step 2: crop quad ---- */

    <canvas id="crop-img"></canvas>
    <div id="crop-overlay" style="position:absolute;pointer-events:none">

    ${nPages>1?`<select id="cr-page" style="width:auto;padding:8px 10px;font-size:12.5px">${Array.from({length:nPages},(_,p)=>`<option value="${p}"${p===SCAN.page?' selected':''}>Página ${p+1} (Q${p*MAXROWS(g)+1}–${Math.min(Q,(p+1)*MAXROWS(g))})</option>`).join('')}</select>`:''}
    <button class="btn btn-sm" id="cr-turn" title="Girar o topo do gabarito em 180 graus">${ICON.redo} Girar 180°</button>
    <span class="spacer"></span>

    img.style.width=Math.round(img.width*s)+'px'; img.style.height=Math.round(img.height*s)+'px';
    ovl.style.left=(img.offsetLeft)+'px'; ovl.style.top=(img.offsetTop)+'px';

    SCAN.quad.forEach((p,i)=>{ const h=document.createElement('div'); h.className='hd';
      h.style.cssText='position:absolute;width:34px;height:34px;pointer-events:auto;touch-action:none;display:grid;place-items:center;cursor:grab;';
      h.innerHTML=`<span style="width:17px;height:17px;border-radius:50%;background:var(--abl);box-shadow:0 1px 6px rgba(0,0,0,.5);color:#231A02;font-size:10px;display:grid;place-items:center">${names[i]}</span>`;

/* ---- image engine (OMR por marcas fiduciais + homografia) ---- */
/* linhas por página: todas as questões cabem numa única folha (até ROWS_COL_MAX linhas por coluna) */
const ROWS_COL_MAX=37;
function MAXROWS(g){ const maxIt=Math.max(...g.itens), bw=maxIt*PD.COL, avail=PD.X1-PD.X0;
  const fit=Math.max(1,Math.floor((avail+CGAP)/(bw+CGAP))); return fit*ROWS_COL_MAX; }
/* geometria impressa (mm) — padrão cartão-resposta:
   bolha Ø3,8 mm · passo vertical 6 mm · passo horizontal 7 mm
   4 quadrados pretos sólidos de 5 mm (FS) centrados a 6 mm (FO) dos cantos da grelha */
const PD={PITCH:6, COL:7, YT:52, X0:24, X1:196, BR:1.9, FO:6, FS:5};
function rowsOnPage(g,pg){ const M=MAXROWS(g), Q=g.itens.length; return Math.min(M, Q-pg*M); }
/* colunas de 10 questões lado a lado; se não couberem, cada coluna recebe mais linhas */
const COLROWS=10, CGAP=9;                      // 9 mm entre colunas (espaço p/ número da questão)
function gridLayout(rows,maxIt){ const bw=maxIt*PD.COL, avail=PD.X1-PD.X0;

  const per=rows<=COLROWS?rows:Math.min(ROWS_COL_MAX,Math.max(COLROWS,Math.ceil(rows/fit)));
  const nCols=Math.ceil(rows/per), w=nCols*bw+(nCols-1)*CGAP;
  const a=Math.max(PD.X0,PD.X0+(avail-w)/2);
  return {a,b:a+w,per,nCols,bw,gRows:Math.min(rows,per)}; }
function YBzone(rows,maxIt){ return PD.YT+gridLayout(rows,maxIt).gRows*PD.PITCH; }
function colX(c,L){ return L.a+c*(L.bw+CGAP); }
/* centros (mm) das 4 marcas: TL, TR, BR, BL */
function fidMM(rows,maxIt){ const L=gridLayout(rows,maxIt), a=L.a, b=L.b, yb=YBzone(rows,maxIt), o=PD.FO;
  return [[a-o,PD.YT-o],[b+o,PD.YT-o],[b+o,yb+o],[a-o,yb+o]]; }
function bubbleMM(rowIdx,i,maxIt,rows){ const L=gridLayout(rows,maxIt), c=Math.floor(rowIdx/L.per), r=rowIdx%L.per;
  return [colX(c,L)+(i+.5)*PD.COL, PD.YT+(r+.5)*PD.PITCH]; }

/* Localiza os 4 quadrados pretos sólidos. Retorna centros normalizados [TL,TR,BR,BL] ou null */

  const tc=document.createElement('canvas'); tc.width=W; tc.height=H;

      if(x<mnx)mnx=x; if(x>mxx)mxx=x; if(y<mny)mny=y; if(y>mxy)mxy=y;
      if(x>0&&bin[q-1]&&!seen[q-1]){seen[q-1]=1;stack[sp++]=q-1;}
      if(x<W-1&&bin[q+1]&&!seen[q+1]){seen[q+1]=1;stack[sp++]=q+1;}

/* Orientação pela numeração impressa, independente do sensor e do cabeçalho. */
const NUMBER_TEMPLATES=new Map();
function numberBitmap(g,w,h){
  const sorted=Array.from(g).sort((a,b)=>a-b), paper=sorted[Math.floor(sorted.length*.8)]||255;
  const threshold=Math.min(175,paper*.72);

  for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(g[y*w+x]<threshold){
    x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);n++; }
  if(n<4||x1<x0||y1-y0<2)return null;
  const bw=x1-x0+1,bh=y1-y0+1, out=new Uint8Array(48*24);
  for(let y=0;y<24;y++)for(let x=0;x<48;x++){

    const py=Math.min(y1,y0+Math.floor((y+.5)*bh/24));

  const text=String(value).padStart(2,'0');
  if(NUMBER_TEMPLATES.has(text))return NUMBER_TEMPLATES.get(text);

  const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,160,56);
  ctx.fillStyle='#000';ctx.font='bold 36px Arial, Helvetica, sans-serif';ctx.fillText(text,5,42);
  const {g,w,h}=grayOf(cv), bitmap=numberBitmap(g,w,h);

function numberSimilarity(a,b){
  if(!a||!b)return 0;

  for(let i=0;i<a.bits.length;i++){hit+=a.bits[i]&&b.bits[i]?1:0;total+=a.bits[i]+b.bits[i];}
  const shape=total?2*hit/total:0;

function questionNumberScore(g,w,h,Hm,rows,maxIt,r0){
  const count=Math.min(rows,12), indices=new Set();
  for(let i=0;i<count;i++)indices.add(count===1?0:Math.round(i*(rows-1)/(count-1)));
  let score=0,valid=0;
  for(const q of indices){
    const [bx,cy]=bubbleMM(q,0,maxIt,rows), end=bx-PD.COL*.5-.6;
    const digits=String(q+r0+1).padStart(2,'0').length;
    const width=digits*1.45+.9, W=Math.ceil(width*7), HH=26, patch=new Uint8Array(W*HH);
    let inside=0;
    for(let y=0;y<HH;y++)for(let x=0;x<W;x++){

    const dst=points.map(p=>[p[0]*w,p[1]*h]);
    const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
    const ratio=(dist(dst[0],dst[1])+dist(dst[3],dst[2]))/(dist(dst[0],dst[3])+dist(dst[1],dst[2]));
    const expected=(exp[1][0]-exp[0][0])/(exp[3][1]-exp[0][1]);

/* ---- leitura das bolhas ---- */
function readSheet(c,quad,itens,r0,r1){
  const rows=r1-r0, maxIt=Math.max(...itens);
  const src=fidMM(rows,maxIt), dst=quad.map(p=>[p[0]*c.width,p[1]*c.height]);
  const H=homography(src,dst); if(!H) throw new Error('marcas inválidas');
  const {g,w,h}=grayOf(c);
  const samp=(u,v)=>{ const [x,y]=hApply(H,u,v); if(x<0||y<0||x>=w-1||y>=h-1) return 255;
    const xi=x|0, yi=y|0, fx=x-xi, fy=y-yi, i=yi*w+xi;
    return (g[i]*(1-fx)+g[i+1]*fx)*(1-fy)+(g[i+w]*(1-fx)+g[i+w+1]*fx)*fy; };
  // escala px/mm para densidade de amostragem
  const [ax,ay]=hApply(H,src[0][0],src[0][1]),[bx,by]=hApply(H,src[1][0],src[1][1]);
  const pxmm=Math.hypot(bx-ax,by-ay)/(src[1][0]-src[0][0]);
  const step=Math.max(0.12,Math.min(0.35,1/pxmm));            // ~1 amostra por pixel
  const disc=(rad)=>{ const pts=[]; for(let y=-rad;y<=rad;y+=step)for(let x=-rad;x<=rad;x+=step) if(x*x+y*y<=rad*rad)pts.push([x,y]); return pts; };
  const ring=(r1_,r2_)=>{ const pts=[]; for(let y=-r2_;y<=r2_;y+=step)for(let x=-r2_;x<=r2_;x+=step){ const d=x*x+y*y; if(d>=r1_*r1_&&d<=r2_*r2_)pts.push([x,y]); } return pts; };
  const BR=PD.BR, Pall=disc(BR+0.25), Pin=disc(BR*0.62), Pbg=ring(BR+0.9,BR+1.4);
  const mean=(u,v,P)=>{ let s=0; for(const [x,y] of P) s+=samp(u+x,v+y); return s/P.length; };
  /* 1) calibração fina: deslocamento por linha que alinha os círculos impressos */
  const offs=[]; const SR=0.9, SS=0.15;
  for(let q=0;q<rows;q++){ const n=itens[q+r0]; const cand=[];
    for(let i=0;i<n;i++){ const [u,v]=bubbleMM(q,i,maxIt,rows); let bd=1e9,bo=[0,0];
      for(let dy=-SR;dy<=SR+1e-6;dy+=SS)for(let dx=-SR;dx<=SR+1e-6;dx+=SS){
        const m=mean(u+dx,v+dy,Pall)+(dx*dx+dy*dy)*6;     // leve preferência pelo centro teórico

    return [median([a[0],o[0],b[0]]),median([a[1],o[1],b[1]])]; });

    for(let i=0;i<n;i++){ const [u0,v0]=bubbleMM(q,i,maxIt,rows), u=u0+sm[q][0], v=v0+sm[q][1];
      const inner=mean(u,v,Pin), bg=Math.max(60,mean(u,v,Pbg));

    const cut=Math.max(thr, mx*0.6);                          // ignora resíduo de borracha perto de marca forte
    marks[q]=row.map((f,i)=>f>=cut?i:-2);

  return {fills,marks,thr,base,maxIt,centers,unc,H,rows};
}

/* imagem endireitada (para exibição e miniatura) */
function rectify(c,H,rows,maxIt){
  const f=fidMM(rows,maxIt), pad=PD.FS;
  const u0=f[0][0]-pad, v0=f[0][1]-pad, u1=f[2][0]+pad, v1=f[2][1]+pad;
  const S=Math.min(10, 900/(u1-u0));
  const W=Math.round((u1-u0)*S), Hh=Math.round((v1-v0)*S);
  const sd=c.getContext('2d',{willReadFrequently:true}).getImageData(0,0,c.width,c.height).data;
  const out=new ImageData(W,Hh), od=out.data, w=c.width, h=c.height;
  for(let y=0;y<Hh;y++)for(let x=0;x<W;x++){ const [px,py]=hApply(H,u0+(x+.5)/S,v0+(y+.5)/S);
    const xi=Math.min(w-1,Math.max(0,px|0)), yi=Math.min(h-1,Math.max(0,py|0)), si=(yi*w+xi)*4, di=(y*W+x)*4;
    od[di]=sd[si];od[di+1]=sd[si+1];od[di+2]=sd[si+2];od[di+3]=255; }
  const cv=document.createElement('canvas'); cv.width=W; cv.height=Hh; cv.getContext('2d').putImageData(out,0,0);
  return {cv,map:(u,v)=>[(u-u0)*S,(v-v0)*S],S};
}
function evalMarks(marks,gab,r0){
  const st=[];
  for(let q=0;q<marks.length;q++){ const gq=gab.corretas[q+r0];
    const marked=marks[q].filter(v=>v>=0);
    if(!marked.length){ st.push('branco'); continue; }
    if(marked.length===1&&marked[0]===gq) st.push('ok'); else st.push('err'); }
  return st; }
function markList(mrow){ const out=[]; for(const v of mrow) if(v>=0) out.push(v); return out; }

/* ---- analysis run ---- */
async function runDetect(){

  try{
    await new Promise(r=>setTimeout(r,60));
    const g=SCAN.gab, Q=g.itens.length;
    const nPages=Math.ceil(Q/MAXROWS(g));
    const pg=Math.min(SCAN.page||0,nPages-1);
    const r0=pg*MAXROWS(g), r1=Math.min(Q,r0+MAXROWS(g));
    if(!SCAN.orientationManual){
      const orientation=orientByQuestionNumbers(SCAN.src,SCAN.quad,r1-r0,Math.max(...g.itens),r0);
      if(!orientation.confident){
        toast('Não consegui confirmar a numeração. Refaça a foto mais perto ou ajuste o topo ↖ para o lado das primeiras questões usando Girar 180°.','abl');
        scGoto('crop');return;

    }
    const d=readSheet(SCAN.src,SCAN.quad,g.itens,r0,r1);
    const wp=rectify(SCAN.src,d.H,d.rows,d.maxIt);
    SCAN.res={wp,d,r0,r1,pg,nPages};
    await new Promise(r=>requestAnimationFrame(r));
    scGoto('res');
    const nu=d.unc.filter(Boolean).length;
    if(nu) toast(`${nu} questão(ões) com leitura incerta — confira as marcadas com borda amarela`,'abl');
  }catch(err){ console.warn(err); toast('Falha ao analisar a imagem — ajuste os 4 pontos sobre os quadrados pretos','err'); scGoto('crop'); }
}
/* ---- step 3: spinner ---- */
function scAna(st,ft){
  st.innerHTML=`<div class="analyzing"><div class="an-ring"></div>
    <div class="an-sheet" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <span>Lendo ${SCAN.gab.itens.length} questões da folha…</span></div>`;
  ft.innerHTML=`<span style="margin:0 auto;color:var(--dim);font-size:12px" class="mono">endireitando · segmentando · comparando gabarito</span>`;
}
/* ---- step 4: result ---- */
function resStatuses(){ const {d,r0}=SCAN.res; const single=d.marks.map(row=>markList(row).length?Math.min(...markList(row)):-1);
  const st=single.map((m,q)=>{ if(m<0)return 'branco'; return m===SCAN.gab.corretas[q+r0]?'ok':'err'; });
  return {single,st}; }
function scRes(st,ft){
  const R=SCAN.res,{single,st:sStat}=resStatuses();
  const {r0,r1,pg,nPages}=R;
  const counts=sStat.reduce((a,s)=>{a[s]++;return a;},{ok:0,err:0,branco:0});
  st.innerHTML=`<div class="sc-result" style="padding:12px;width:100%;max-width:660px;align-self:start">
    <div class="sc-imgwrap"><canvas id="res-cv"></canvas></div>
    <div class="sc-side">
      <div class="score-big"><b id="res-n">${counts.ok}</b><small>de ${sStat.length} questões desta página · ${counts.err} erradas · ${counts.branco} em branco</small></div>
      ${nPages>1?`<div class="pill mut" style="align-self:flex-start">página ${pg+1}/${nPages} · questões ${r0+1}–${r1}</div>`:''}
      <div class="qmark-grid" id="res-qm"></div>
      <details id="adj-box" style="margin-top:2px">
        <summary style="font-size:12px;color:var(--mut);cursor:pointer">Ajustar marcações manualmente (se a leitura errou)</summary>
        <div class="matrix dots-bg matrix-scroll" id="res-mx" style="margin-top:8px;padding:10px;border:1px solid var(--line-soft);border-radius:10px;background:var(--panel)"></div>
      </details>
    </div>
  </div>`;
  drawResImg(single); drawQmarks(single,sStat); drawMatrix(single);
  $('#res-mx').addEventListener('click',e=>{ const b=e.target.closest('.bub'); if(!b)return;
    const q=+b.dataset.q,i=+b.dataset.i;
    single[q]=(single[q]===i)?-1:i;
    R.d.marks[q]=Array.from({length:SCAN.gab.itens[q+r0]},(_,k)=>k===single[q]?k:-2);
    const s2=single.map((m,q2)=>m<0?'branco':(m===SCAN.gab.corretas[q2+r0]?'ok':'err'));
    const c2=s2.reduce((a,x)=>{a[x]++;return a;},{ok:0,err:0,branco:0});
    $('#res-n').textContent=c2.ok; $('#res-n').closest('.score-big').querySelector('small').textContent=
      `de ${s2.length} questões desta página · ${c2.err} erradas · ${c2.branco} em branco`;
    drawResImg(single); drawQmarks(single,s2); drawMatrix(single);
  });
  const hasNext=R.pg<R.nPages-1;
  ft.innerHTML=`
    <button class="btn btn-sm btn-err" id="rs-del">${ICON.trash} Excluir</button>
    <button class="btn btn-sm" id="rs-again">${ICON.redo} Refazer foto</button>
    <button class="btn btn-sm btn-ghost" id="rs-adj">Ajustar pontos</button>
    <span class="spacer"></span>
    <button class="btn btn-cap" id="rs-save">${ICON.save} ${hasNext?`Salvar pág. ${R.pg+1} e próxima →`:'Salvar leitura'}</button>`;
  $('#rs-again').addEventListener('click',()=>scGoto('cam'));
  $('#rs-adj').addEventListener('click',()=>scGoto('crop'));
  $('#rs-del').addEventListener('click',()=>{
    const prev=DB.corr.filter(c=>c.alunoId===SCAN.alunoId&&c.gabId===SCAN.gab.id&&c.r0===R.r0);
    if(prev.length){ if(confirm(`Excluir ${prev.length} leitura(s) salva(s) de ${SCAN.alunoNm}?`)){
        DB.corr=DB.corr.filter(c=>!prev.includes(c)); saveDB(); toast('Leitura excluída'); }}
    else toast('Nada salvo desta página para excluir','abl');
    SCAN.stopStream(); closeModal(); RENDER.corrigir(); });
  $('#rs-save').addEventListener('click',()=>{
    const okSave=saveLeitura(single);
    if(!okSave)return;
    if(hasNext){ toast(`Página ${R.pg+1} salva para ${SCAN.alunoNm}`); SCAN.page=R.pg+1; scGoto('cam'); RENDER.corrigir(); }
    else { toast(`Leitura de ${SCAN.alunoNm} salva`); SCAN.stopStream(); closeModal(); navTo('corrigir'); RENDER.corrigir(); } });
}
function saveLeitura(single){
  const R=SCAN.res;
  const st=single.map((m,q)=>m<0?'branco':(m===SCAN.gab.corretas[q+R.r0]?'ok':'err'));
  const counts=st.reduce((a,s)=>{a[s]++;return a;},{ok:0,err:0,branco:0});
  let thumb=null;
  try{ const t=document.createElement('canvas'); const s2=320/R.wp.cv.width;
    t.width=320;t.height=Math.round(R.wp.cv.height*s2);
    t.getContext('2d').drawImage(resOverlay(single),0,0,t.width,t.height);
    thumb=t.toDataURL('image/jpeg',0.62); }catch(e){ }
  const rec={id:uid(),alunoId:SCAN.alunoId,alunoNm:SCAN.alunoNm,turmaId:CTX.turma,gabId:SCAN.gab.id,
    data:Date.now(),r0:R.r0,r1:R.r1,page:R.pg,total:st.length,acertos:counts.ok,
    acertosP:counts.ok,errosP:counts.err,brancosP:counts.branco,marks:single,status:st,thumb};
  DB.corr=DB.corr.filter(c=>!(c.alunoId===SCAN.alunoId&&c.gabId===SCAN.gab.id&&c.r0===R.r0));
  DB.corr.push(rec);
  return saveDB();
}
function resOverlay(single){
  const R=SCAN.res, g=SCAN.gab, cv=R.wp.cv, {centers,unc}=R.d, map=R.wp.map;
  const out=document.createElement('canvas'); out.width=cv.width; out.height=cv.height;
  const cx=out.getContext('2d'); cx.drawImage(cv,0,0);
  const {r0,r1}=R; const Q=r1-r0; const r=PD.BR*R.wp.S*1.08;
  cx.lineWidth=Math.max(1.5,r*0.22);
  for(let q=0;q<Q;q++){ const m=single[q];
    for(let i=0;i<g.itens[q+r0];i++){ const [cxx,cyy]=map(centers[q][i][0],centers[q][i][1]);
      const isMark=m===i, isCorr=g.corretas[q+r0]===i;
      if(isMark&&isCorr){ cx.fillStyle='rgba(62,207,142,.6)'; cx.beginPath();cx.arc(cxx,cyy,r,0,7);cx.fill(); ring(cx,cxx,cyy,r,'#3ECF8E'); }
      else if(isMark){ cx.fillStyle='rgba(244,96,91,.6)';cx.beginPath();cx.arc(cxx,cyy,r,0,7);cx.fill(); ring(cx,cxx,cyy,r,'#F4605B'); }
      else if(isCorr){ ring(cx,cxx,cyy,r*1.25,m<0?'#FFC53D':'rgba(62,207,142,.9)'); }
    }
    if(unc&&unc[q]){ const [ax,ay]=map(centers[q][0][0]-PD.COL*0.55,centers[q][0][1]);
      cx.fillStyle='#FFC53D'; cx.beginPath(); cx.arc(ax-r*0.6,ay,r*0.45,0,7); cx.fill(); }
  }
  return out;
}
function ring(cx,x,y,rr,col){ cx.strokeStyle=col;cx.lineWidth=Math.max(1.5,rr*0.2);cx.beginPath();cx.arc(x,y,rr,0,7);cx.stroke(); }
function drawResImg(single){ const cv=$('#res-cv'); const img=resOverlay(single);
  cv.width=img.width;cv.height=img.height; cv.getContext('2d').drawImage(img,0,0); }
function drawQmarks(single,sStat){
  $('#res-qm').innerHTML=sStat.map((s,q)=>{ const m=single[q];
    const letra=m>=0?itemLabel(m):'—'; const cor=itemLabel(SCAN.gab.corretas[q+SCAN.res.r0]);
    const un=SCAN.res.d.unc&&SCAN.res.d.unc[q];
    return `<div class="qmark ${s==='ok'?'g':s==='err'?'r':'y'}"${un?' style="outline:2px dashed var(--abl);outline-offset:1px"':''} title="Q${q+1+SCAN.res.r0}: ${s==='ok'?'acerto':s==='err'?`item ${letra}`:`em branco · correta ${cor}`}">
      <b>Q${q+1+SCAN.res.r0}</b><i>${s==='ok'?'✓':s==='err'?'✗':'—'}</i><span style="color:var(--mut)">${letra}</span></div>`;}).join('');
}
function drawMatrix(single){
  const R=SCAN.res,g=SCAN.gab;
  $('#res-mx').innerHTML=Array.from({length:R.r1-R.r0},(_,q)=>`<div class="mrow"><span class="qn">Q${q+R.r0+1}</span>
    <div class="row" style="gap:6px;flex-wrap:wrap">${Array.from({length:g.itens[q+R.r0]},(_,i)=>
      `<button type="button" class="bub${single[q]===i?' sel':''}" data-q="${q}" data-i="${i}" style="width:26px;height:26px">${itemLabel(i)}</button>`).join('')}</div></div>`).join('');
}
/* ---- merged (multi-page) helpers ---- */
function corrAgg(alunoId,gabId){
  const g=getGab(gabId); if(!g)return null;
  const Q=g.itens.length; const slots=new Array(Q).fill(null); const st=new Array(Q).fill(null);
  DB.corr.filter(c=>c.alunoId===alunoId&&c.gabId===gabId).sort((a,b)=>a.data-b.data)
    .forEach(c=>{ for(let i=0;i<c.marks.length;i++){ const q=c.r0+i; if(q<Q){slots[q]=c.marks[i]; st[q]=c.status[i];} } });
  const filled=st.filter(s=>s).length, ok=st.filter(s=>s==='ok').length;
  return {Q,filled,ok,complete:filled===Q};
}
</script>
